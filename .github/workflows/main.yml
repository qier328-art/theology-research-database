name: Update Theology Research Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Update research database
        run: |
          python - <<'PY'
          import requests
          import pandas as pd
          from pathlib import Path

          FILE = "theology_latest_research_2020_2026.csv"

          url = "https://api.openalex.org/works"

          params = {
              "search": "theology",
              "filter": "from_publication_date:2020-01-01,to_publication_date:2026-12-31",
              "sort": "publication_date:desc",
              "per-page": 200
          }

          response = requests.get(
              url,
              params=params,
              timeout=60
          )

          response.raise_for_status()

          data = response.json().get("results", [])

          records = []

          for work in data:

              authors = []

              for authorship in work.get("authorships") or []:
                  author = authorship.get("author") or {}
                  name = author.get("display_name")

                  if name:
                      authors.append(name)

              primary_location = work.get("primary_location") or {}
              source = primary_location.get("source") or {}

              records.append({
                  "Title": work.get("title") or "",
                  "Authors": "; ".join(authors),
                  "Publication Date": work.get("publication_date") or "",
                  "Journal": source.get("display_name") or "",
                  "DOI": work.get("doi") or "",
                  "OpenAlex ID": work.get("id") or "",
                  "URL": primary_location.get("landing_page_url") or ""
              })

          new_df = pd.DataFrame(records)

          if Path(FILE).exists():

              old_df = pd.read_csv(
                  FILE,
                  encoding="utf-8-sig"
              )

              combined = pd.concat(
                  [old_df, new_df],
                  ignore_index=True
              )

          else:

              combined = new_df

          if "DOI" in combined.columns:

              combined["DOI"] = combined["DOI"].fillna("").astype(str)

              combined = combined[
                  (combined["DOI"] == "")
                  | (~combined.duplicated(
                      subset=["DOI"],
                      keep="first"
                  ))
              ]

          if "OpenAlex ID" in combined.columns:

              combined["OpenAlex ID"] = (
                  combined["OpenAlex ID"]
                  .fillna("")
                  .astype(str)
              )

              combined = combined[
                  (combined["OpenAlex ID"] == "")
                  | (~combined.duplicated(
                      subset=["OpenAlex ID"],
                      keep="first"
                  ))
              ]

          combined.to_csv(
              FILE,
              index=False,
              encoding="utf-8-sig"
          )

          print(
              f"Database now contains {len(combined)} records."
          )

          PY

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add theology_latest_research_2020_2026.csv

          if git diff --cached --quiet; then
            echo "No new records."
          else
            git commit -m "Update theology research database"
            git push
          fi
